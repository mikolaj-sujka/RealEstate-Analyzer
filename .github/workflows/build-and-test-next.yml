name: Next.js - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    # 1) Ustaw domyślny working-directory dla wszystkich kroków `run`
    defaults:
      run:
        working-directory: rea_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Najpierw Node, z cachingiem pnpm i lockfilem w podkatalogu
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: rea_frontend/pnpm-lock.yaml

      # 3) Potem pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      # 4) Prostsze, bezawaryjne uruchamianie testów
      - name: Run tests (if present)
        run: pnpm test --if-present
