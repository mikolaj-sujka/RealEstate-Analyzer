name: Next.js - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        working-directory: rea_frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: rea_frontend/pnpm-lock.yaml

      # <<< KLUCZOWE: włącz Corepack i aktywuj pnpm >>>
      - name: Enable Corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          which pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run tests (if present)
        run: pnpm test --if-present
