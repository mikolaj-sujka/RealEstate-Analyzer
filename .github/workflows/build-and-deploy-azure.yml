# .github/workflows/deploy-webapp.yml
name: Build and deploy ASP.NET Core to Azure Web App - app-rea-apps-api2-prod-plc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-rea-apps-api2-prod-plc
  DOTNET_VERSION: '9.x'
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # (opcjonalnie) szybka diagnostyka struktury repo
      - name: List repo (debug)
        run: |
          echo "Root:"
          ls -la
          echo "All csproj files:"
          git ls-files '*.csproj' || true

      # AUTOMATYCZNE wykrycie ścieżki do projektu API (case-sensitive)
      - name: Detect API project path
        run: |
          set -euo pipefail
          FOUND=$(git ls-files '**/RealEstateAnalyzer.Api.csproj' | head -n 1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::Nie znaleziono RealEstateAnalyzer.Api.csproj. Sprawdź układ katalogów i wielkość liter."
            exit 1
          fi
          echo "PROJECT_PATH=$FOUND" >> $GITHUB_ENV
          echo "Detected PROJECT_PATH=$FOUND"

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # wymagane dla OIDC
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./webapp

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DEEC09BEEEE41FDB621DE11FEE1FA96 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FFFF88AB1C414DBFA58F16B3B5A581E4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4BBC8186B8344EE8B625CF80E7F8E17 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./webapp
