name: Build and deploy ASP.NET Core to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-rea-apps-api-prod-plc
  DOTNET_VERSION: '9.x'
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Detect API project path
        run: |
          set -euo pipefail
          FOUND=$(git ls-files '**/RealEstateAnalyzer.Api.csproj' | head -n 1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::Nie znaleziono RealEstateAnalyzer.Api.csproj."
            exit 1
          fi
          echo "PROJECT_PATH=$FOUND" >> $GITHUB_ENV
          echo "Detected PROJECT_PATH=$FOUND"

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish (Release)
        run: dotnet publish "$PROJECT_PATH" -c Release -o "${{ env.PUBLISH_DIR }}" --no-restore

      - name: Zip publish output
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r ../app.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-zip
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-zip
          path: .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D863C9DE6ED1471DA33847E16B360C5B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ED1106073B804D62834FB17EBE3D7C72}}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CCCD652E3E2E413389EFE445DDDB735F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: app.zip
