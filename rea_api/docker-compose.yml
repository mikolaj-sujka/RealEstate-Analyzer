version: '2.4'

volumes:
  redis-data:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: RealEstateAnalyzer.Api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
      - Redis__InstanceName=RealEstateAnalyzer
    ports:
      - "5000:80"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Accept: application/json' http://localhost:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
